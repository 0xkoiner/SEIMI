[package]
name = "SEIMI"
edition = "2024"
version = "0.1.0"

[dependencies]
log = "0.4.30"
toml = "1.1.2"
tracing = "0.1"
serde_json = "1"
dotenvy = "0.15.7"
thiserror = "2.0.18"
env_logger = "0.11.10"
alloy = { version = "2", features = [ "full" ] }
tokio = { version = "1.52.3", features = [ "full" ] }
serde = { version = "1.0.228", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = [ "env-filter", "fmt" ] }
sqlx = { version = "0.9.0", features = [ "runtime-tokio", "postgres", "chrono", "bigdecimal" ] }
