# --- Connections ---
listen_addresses = '*'
max_connections = 100                  # keep low; use a pooler (PgBouncer) instead of raising this

# --- Memory ---
shared_buffers = 2GB                   # ~25% of RAM
effective_cache_size = 6GB             # ~75% of RAM (planner hint, not an allocation)
work_mem = 16MB                        # per sort/hash op — multiply by connections × ops
maintenance_work_mem = 512MB           # VACUUM, CREATE INDEX
huge_pages = try

# --- WAL / Durability ---
wal_level = replica
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_completion_target = 0.9     # spread checkpoint I/O
wal_compression = on
synchronous_commit = on                # set 'off' only if you can tolerate losing recent commits

# --- Planner (SSD) ---
random_page_cost = 1.1
effective_io_concurrency = 200

# --- Parallelism ---
max_worker_processes = 8               # ~= vCPU count
max_parallel_workers = 8
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 4

# --- Autovacuum (more aggressive than defaults) ---
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.025

# --- Logging / observability ---
logging_collector = off                # let Docker capture stdout
log_min_duration_statement = 500ms     # log slow queries
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
log_line_prefix = '%m [%p] %u@%d '
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all

# --- Timeouts (safety) ---
statement_timeout = 60s
idle_in_transaction_session_timeout = 60s